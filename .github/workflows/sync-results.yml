name: Sync resultados · Vamos Argentina

# Corre cada hora automáticamente, y también se puede disparar a mano
# desde la pestaña "Actions" de GitHub con el botón "Run workflow".
on:
  schedule:
    - cron: '0 * * * *'   # cada hora en punto (UTC)
  workflow_dispatch: {}     # botón manual

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Usar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sincronizar resultados desde football-data.org a Supabase
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/sync-results.mjs
